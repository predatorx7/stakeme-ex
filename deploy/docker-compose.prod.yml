# SMX production stack for a single VM: caddy (TLS) -> app -> postgres.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Run from the repo root. Expects, next to this repo root:
#   .env       app secrets (copied with scp, never committed)
#   .env.prod  overlay generated by deploy/gcp.sh (NODE_ENV, CANONICAL_ORIGIN,
#              DB_URI, SMX_DOMAIN, POSTGRES_PASSWORD); later files win.
name: smx

services:
  postgres:
    image: ghcr.io/haathie/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    # pg_cron and the pgmb tuning live in the shared dev config.
    command: -c config_file=/etc/postgresql.conf
    volumes:
      - ../dev/pg.conf:/etc/postgresql.conf:ro
      - postgres-data:/var/lib/postgresql/data
    # No published port: only the app reaches it, over the compose network.
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies pending migrations (pgmb, pg_cron, domain schema).
  # Reuses the image the app service builds (one build, no parallel npm ci).
  migrate:
    image: smx-app:latest
    pull_policy: never
    command: node packages/app/scripts/migrate.ts
    environment:
      DB_URI: ${DB_URI:?set DB_URI}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: ..
      target: runtime
    image: smx-app:latest
    restart: unless-stopped
    env_file:
      - ${SMX_ENV_FILE:-../.env}
      - ${SMX_ENV_PROD_FILE:-../.env.prod}
    environment:
      PORT: '4020'
    expose:
      - '4020'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SMX_DOMAIN: ${SMX_DOMAIN:?set SMX_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
