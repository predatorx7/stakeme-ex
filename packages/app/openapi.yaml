openapi: 3.1.1
info:
  title: StakeMe Exchange
  version: 0.1.0
  description: |
    StakeMe Exchange (SMX) serves two surfaces from the same routes through
    content negotiation:

    - **HTML / htmx** pages and fragments for the exchange UI
      (`Accept: text/html`). Mutating endpoints called from htmx may return
      `HX-Redirect` / `HX-Trigger` response headers to drive client-side
      navigation.
    - **JSON API** for SDK and backend clients (`Accept: application/json`).

    Errors from JSON callers follow **RFC 9457 (Problem Details for HTTP
    APIs)**, returned with `Content-Type: application/problem+json`. HTML
    callers receive a rendered error page with the same status code. Every
    operation declares `default: ProblemResponse`; specific status codes are
    spelled out only when they're part of the operation's contract (for
    example, `404` on a resource GET, `409` on a constraint violation).

    **Pagination.** List endpoints use opaque cursor pagination. First
    request: omit `?cursor`. The response includes `nextPageCursor` if more
    results exist; omit the field on the final page. Pass the received cursor
    back verbatim as `?cursor=` on the next request. Clients MUST treat it as
    opaque.

    **Authentication.** Sign in with Ethereum (EIP-4361) through Better
    Auth: `POST /auth/siwe/nonce`, sign the message, `POST /auth/siwe/verify`.
    The session is an HTTP-only cookie, or a bearer token for API clients.
    The `/auth/*` routes belong to Better Auth and are not listed here.
servers:
  - url: http://localhost:4020
    description: Dev
tags:
  - name: Exchange
    description: Public exchange pages and the JSON that backs them.
  - name: Creators
    description: Launching an L-ISA IPO and investing in or trading a creator.
  - name: Demo
    description: Presenter helpers, only with DEMO_MODE=1.
  - name: Income
    description: Reclaim income proofs, audits, dividends and defaults.
  - name: Events
    description: Live oracle events (Server-Sent Events).
  - name: Watchlist
    description: The signed-in viewer's followed creators.
  - name: Portfolio
    description: The signed-in viewer's funds, holdings, transactions and dividends.
paths:
  /:
    get:
      summary: Exchange
      operationId: GetExchange
      tags:
        - Exchange
      description: >-
        Lists trending creators with price, 24h change and a sparkline, plus
        the latest oracle events. Use it as the exchange home page; the HTML
        page subscribes to `GET /events` for live updates. At most `limit`
        creators are returned.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of trending creators.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Exchange page (HTML) or exchange document (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /activity:
    get:
      summary: Oracle activity
      operationId: ListActivity
      tags:
        - Exchange
      description: >-
        Lists oracle events, newest first, 50 per page. Use it as the full page
        behind the live events feed (`GET /events` is the live stream).
        Filter by `kind` and `ticker`. Page with `cursor` and
        `nextPageCursor`.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Only events of this kind. `all` (default) applies no filter.
          schema:
            type: string
            default: all
            enum:
              - all
              - IPO
              - INVESTED
              - PROOF_VERIFIED
              - PROOF_REJECTED
              - TRANCHE_RELEASED
              - STAKE_RETURNED
              - DIVIDEND_PAID
              - GRACE_STARTED
              - DEFAULTED
              - TRADE
              - ESCROW_FROZEN
              - ESCROW_UNFROZEN
              - STORAGE_CONFIRMED
              - CREATOR_UPDATE
        - name: ticker
          in: query
          required: false
          description: >-
            Only events of this creator (case-insensitive). Empty applies no
            filter.
          schema:
            type: string
            pattern: ^[A-Za-z]{0,6}$
            maxLength: 6
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Activity page (HTML) or one page of events (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}:
    get:
      summary: Creator token page
      operationId: GetCreator
      tags:
        - Creators
      description: >-
        Returns one creator's terms, escrow progress, price chart, top holders,
        recent trades, proofs, dividends and events, the `market` instrument
        data (quote, depth, fundamentals, corporate actions), plus the
        signed-in viewer's holding and position. Use it for the token page; `404` when the ticker is
        unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Token page (HTML) or creator page document (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/candles:
    get:
      summary: Creator candles
      operationId: GetCreatorCandles
      tags:
        - Creators
      description: >-
        Returns OHLCV candles for the token chart, oldest first, at most 200.
        `interval` is the visible range: `1H` gives 1-minute candles (60), `1D`
        1-hour (24), `1W` 4-hour (42) and `ALL` the creator's whole life in
        buckets sized to stay within 200. Empty buckets repeat the previous
        close with zero volume; `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: interval
          in: query
          required: true
          description: Visible chart range, which fixes the candle size.
          schema:
            type: string
            enum: [1H, 1D, 1W, ALL]
      responses:
        '200':
          description: Candles, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candles'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/chart:
    get:
      summary: Creator chart fragment
      operationId: GetCreatorChartFragment
      tags:
        - Creators
      description: >-
        Returns the price chart region (interval tabs plus a line or candle
        plot) as an HTML fragment for in-place swaps; `404` when the ticker is
        unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: interval
          in: query
          required: false
          description: Visible chart range; defaults to `1D`.
          schema:
            type: string
            enum: [1H, 1D, 1W, ALL]
        - name: mode
          in: query
          required: false
          description: Plot type; defaults to `candles`.
          schema:
            type: string
            enum: [line, candles]
      responses:
        '200':
          description: Chart region (HTML).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /watchlist:
    get:
      summary: Watchlist
      operationId: GetWatchlist
      tags:
        - Watchlist
      description: >-
        Lists the signed-in viewer's watched creators, newest first, with price,
        24h change and sparkline. Holds at most 100 creators, so it isn't paged.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The viewer's watchlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /watchlist/{ticker}:
    put:
      summary: Add to watchlist
      operationId: PutWatchlistItem
      tags:
        - Watchlist
      description: >-
        Adds a creator to the viewer's watchlist. Calling it again is a no-op
        that returns the existing item; `404` when the ticker is unknown, `409`
        when the watchlist already holds 100 creators.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: The watchlist item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      summary: Remove from watchlist
      operationId: DeleteWatchlistItem
      tags:
        - Watchlist
      description: >-
        Removes a creator from the viewer's watchlist. Calling it for a creator
        that isn't watched is a no-op; `404` when the ticker is unknown.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '204':
          description: Removed (or was not on the watchlist).
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/holders:
    get:
      summary: Creator holders
      operationId: ListCreatorHolders
      tags:
        - Creators
      description: >-
        Lists wallets holding a creator token, largest first, 25 per page. Use it as the full page behind the token page holders table; `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Holders page (HTML) or one page of holders (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/HoldersPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/proofs:
    get:
      summary: Creator income proofs
      operationId: ListCreatorProofs
      tags:
        - Creators
      description: >-
        Lists a creator income proofs, newest first, 25 per page. Use it as the full page behind the token page proofs table; `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Proofs page (HTML) or one page of income proofs (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/ProofsPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/updates:
    get:
      summary: Creator updates
      operationId: ListCreatorUpdates
      tags:
        - Creators
      description: >-
        Lists a creator's updates to holders, newest first, 25 per page. Use it
        for the "View all" page behind the latest updates on the token page;
        `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Updates page (HTML) or one page of updates (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorUpdatesPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      summary: Post a creator update
      operationId: CreateCreatorUpdate
      tags:
        - Creators
      description: >-
        Posts a short plain-text update to holders. Only the creator's owner can
        post, up to 5 per rolling 24 hours. Emits a `CREATOR_UPDATE` event for
        the live feed and the corporate-actions timeline. Returns `201` with
        the update for JSON callers and `204` for htmx, which refreshes the
        update list.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreatorUpdateRequest'
      responses:
        '201':
          description: The new update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorUpdate'
        '204':
          description: htmx request; the update list refreshes.
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/dividends:
    get:
      summary: Creator dividends
      operationId: ListCreatorDividends
      tags:
        - Creators
      description: >-
        Lists a creator dividends, newest first, 25 per page. Use it as the full page behind the token page dividends table; `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Dividends page (HTML) or one page of dividends (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/DividendsPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/audit-report:
    get:
      summary: Premium audit report (x402)
      operationId: GetCreatorAuditReport
      tags:
        - Creators
      description: >-
        Returns a creator's latest 0G audit log and verified-income history.
        Gated by x402 on Hedera testnet: without payment it answers `402` with
        the payment requirements (`PAYMENT-REQUIRED` header and body, 0.1 HBAR
        `exact`, asset `0.0.0`). Send the signed payment in `X-PAYMENT` (or
        `PAYMENT-SIGNATURE`) as base64 JSON; the x402 facilitator verifies and
        settles it, and the `200` carries `X-PAYMENT-RESPONSE` with the Hedera
        transaction id.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: The audit report.
          headers:
            X-PAYMENT-RESPONSE:
              description: Base64 JSON settlement response (transaction id).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReport'
        '402':
          description: Payment required (x402 v2 requirements).
          headers:
            PAYMENT-REQUIRED:
              description: Base64 JSON of the same requirements as the body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402PaymentRequired'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /portfolio:
    get:
      summary: Portfolio
      operationId: GetPortfolio
      tags:
        - Portfolio
      description: >-
        Returns the signed-in viewer's portfolio: funds (wallet USDC and HBAR),
        holdings with P&L, transactions (25 per page, newest first, `cursor`
        pages them) and dividends received. HTML for a browser; signed out, the
        page asks the visitor to connect a wallet and JSON callers get `401`.
        `funds.status` is `UNAVAILABLE` in simulated chain mode or when the
        chain read fails.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Portfolio page (HTML) or document (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /portfolio/faucet:
    post:
      summary: Get test USDC
      operationId: RequestTestUsdc
      tags:
        - Portfolio
      description: >-
        Mints a fixed amount of MockUSDC to the viewer's wallet through the
        token's public faucet. One request per wallet per minute. `409` when
        the chain is simulated or no USDC token is configured.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: htmx request; the page reloads with the new balance.
        '201':
          description: The faucet transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaucetResult'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /portfolio/claims:
    post:
      summary: Record a dividend claim
      operationId: CreateDividendClaim
      tags:
        - Portfolio
      description: >-
        Live chain mode: the holder signs `LiquidISA.claim()` in their wallet,
        then sends the `txHash`. The server verifies the receipt (sent by the
        viewer's wallet to the creator's ISA, with a `Claimed` event for that
        wallet) and records the claim. Idempotent by `txHash`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendClaimRequest'
      responses:
        '201':
          description: The recorded claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendClaim'
        '204':
          description: htmx request; the `HX-Trigger` header carries the result.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /hub:
    get:
      summary: Creator hub
      operationId: GetCreatorHub
      tags:
        - Creators
      description: >-
        Returns the signed-in viewer's own creator dashboard: escrow, pending
        dividend, proofs, chain jobs and collateral. `creator` is absent when
        the viewer hasn't launched an IPO yet.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Hub page (HTML) or hub document (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorHub'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /launch:
    get:
      summary: Launch an IPO
      operationId: GetLaunch
      tags:
        - Creators
      description: >-
        Returns the IPO form state: the viewer's wallet, default terms, the
        World ID configuration and whether the viewer already launched. The
        form posts to `POST /creators`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Launch page (HTML) or launch state (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchState'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators:
    get:
      summary: All creators
      operationId: ListCreators
      tags:
        - Exchange
      description: >-
        Lists every creator, 25 per page, with price, 24h change and a
        sparkline. Use it as the full page behind the trending widget. Sort by
        `trending` (default), `newest` or `raised`, filter by `status`, and
        search ticker or name with `q`. Page with `cursor` and
        `nextPageCursor`.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: Sort order.
          schema:
            type: string
            enum: [trending, newest, raised]
            default: trending
        - name: status
          in: query
          required: false
          description: Only creators with this status. `all` (default) applies no filter.
          schema:
            type: string
            enum: [all, live, grace, defaulted]
            default: all
        - name: q
          in: query
          required: false
          description: Case-insensitive match on ticker or display name. Empty applies no filter.
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Creators page (HTML) or one page of creators (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorsPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      summary: Launch an IPO
      operationId: LaunchIpo
      tags:
        - Creators
      description: >-
        Verifies the World ID proof (signal is the viewer's wallet), writes the
        L-ISA legal terms to 0G Storage, then creates the creator, tranches, pool and first
        price tick in one statement. Use it from the launch form. The viewer
        needs a linked wallet and one World ID can launch once. Returns `201`
        with the creator for JSON callers and an `HX-Redirect` to the token
        page for htmx.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchIpoRequest'
      responses:
        '201':
          description: The new creator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
        '204':
          description: htmx request; the `HX-Redirect` header points at the token page.
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/chain:
    get:
      summary: Creator onchain trading info
      operationId: GetCreatorChain
      tags:
        - Creators
      description: >-
        Says how the browser trades this creator. `live` means the user's
        wallet signs `approve` plus the swap or invest call and then posts the
        `txHash` to `Trade` or `Invest`; `simulated` means the SQL pool path
        (no `txHash`). Carries the contract addresses and a public RPC URL for
        reads. `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Onchain trading info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorChain'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/investments:
    post:
      summary: Invest in a creator
      operationId: Invest
      tags:
        - Creators
      description: >-
        Buys creator tokens 1:1 with USDC at the IPO price from the primary
        market, capped at the remaining raise. Use it while the creator is
        `LIVE`; `409` when the raise is full or closed. In simulated chain mode
        send `usdcAmount`: state commits immediately and the onchain call is
        queued. In live mode (see `GetCreatorChain`) the user signs `approve`
        and `LiquidISA.invest` first, then sends the `txHash`; the server
        verifies the receipt and records the exact `Invested` event.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestRequest'
      responses:
        '201':
          description: The investment and the resulting holding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investment'
        '204':
          description: htmx request; the `HX-Trigger` header carries the result.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/close-raise:
    post:
      summary: Close the raise early
      operationId: CloseRaise
      tags:
        - Creators
      description: >-
        The creator ends the raise before it fills. Tranches resize to the
        amount raised, tranche 0 releases and trading opens. Owner only; `409`
        when the raise is closed or nothing was raised. In simulated chain mode
        send no body. In live mode (see `GetCreatorChain`) the creator signs
        `LiquidISA.closeRaise` first, then sends the `txHash`; the server
        verifies the receipt.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseRaiseRequest'
      responses:
        '201':
          description: The raise is closed.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
        '204':
          description: htmx request; the `HX-Trigger` header carries the result.
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/trades:
    get:
      summary: Creator trades
      operationId: ListCreatorTrades
      tags:
        - Creators
      description: >-
        Lists a creator trades, newest first, 25 per page. Use it as the full page for the trade history; `404` when the ticker is unknown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trades page (HTML) or one page of trades (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/TradesPage'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      summary: Trade creator tokens
      operationId: Trade
      tags:
        - Creators
      description: >-
        Swaps against the constant-product pool with a 0.3% fee. In simulated
        chain mode send `side` and `amountIn`: `BUY` spends USDC, `SELL` spends
        tokens, `minOut` is the slippage guard; `409` when output falls below
        it, the creator is defaulted, or the seller lacks balance. In live mode
        (see `GetCreatorChain`) the user signs `approve` and the pool swap
        first, then sends the `txHash`; the server verifies the receipt and
        records the exact `Swap` event, once per hash.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '201':
          description: The executed trade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '204':
          description: htmx request; the `HX-Trigger` header carries the result.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /creators/{ticker}/reclaim-sessions:
    post:
      summary: Start a Reclaim income proof
      operationId: CreateReclaimSession
      tags:
        - Income
      description: >-
        Creates a Reclaim verification session for the creator's bank deposit.
        Only the creator can call it. Open `requestUrl` to prove the deposit
        and poll `statusUrl`; Reclaim posts the proof to `POST
        /reclaim/callback`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '201':
          description: The Reclaim session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclaimSession'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /reclaim/callback:
    post:
      summary: Reclaim proof callback
      operationId: ReclaimCallback
      tags:
        - Income
      description: >-
        Receives the proof Reclaim posts after a session. Public, because the
        caller is Reclaim; the proof signature is verified, so an unverifiable
        body is rejected. Verified proofs are audited and may approve a
        milestone, exactly like `POST /api/audit-milestone`. Demo fixtures are
        never accepted here.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProofBody'
      responses:
        '200':
          description: >-
            Acknowledged without a new audit: a failure event, a redelivery, or
            a result that cannot verify (retrying would not help).
        '201':
          description: Audit result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
        '202':
          description: >-
            Accepted but not approved: the 0G audit was unavailable, so the
            proof stays `PENDING` with `audit_status` `AUDIT_UNAVAILABLE`.
            Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/audit-milestone:
    post:
      summary: Audit an income proof
      operationId: AuditMilestone
      tags:
        - Income
      description: >-
        Verifies a Reclaim proof, runs the 0G audit, then applies the SQL rules
        engine: approval creates the dividend and releases the next tranche.
        The proof must verify (`400` otherwise); a duplicate proof returns
        `409`. Demo fixtures (`demo: true`, DEMO_MODE only) are accepted only
        from the signed-in creator they name (`401` anonymous, `403` anyone
        else), at most 3 per creator per hour (`429`). Real Reclaim proofs
        need no sign-in.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofBody'
      responses:
        '201':
          description: Audit result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
        '202':
          description: >-
            Accepted but not approved: the 0G audit was unavailable, so the
            proof stays `PENDING` with `audit_status` `AUDIT_UNAVAILABLE`.
            Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/zero-g/balance:
    get:
      summary: 0G Router credit balance
      operationId: GetZeroGBalance
      tags:
        - Income
      description: >-
        The remaining 0G Private Computer (Router) credit that pays for the AI
        audit, read server-side with the management key and cached for about 30
        seconds. Returns HTML for htmx and JSON otherwise; `configured` is
        false when no key is set.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance readout (HTML) or document (JSON).
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
            application/json:
              schema:
                $ref: '#/components/schemas/ZeroGBalance'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /demo/reset:
    post:
      summary: Reset the demo creator (demo)
      operationId: DemoReset
      tags:
        - Demo
      description: >-
        Demo only. Deletes the reserved creator and every dependent row, frees
        its World ID nullifier and bumps the demo epoch so the next onchain IPO
        registers a fresh nullifier hash. `403` unless `DEMO_MODE=1` and the
        signed-in wallet is in `DEMO_PRESENTER_WALLETS` (or `X-Admin-Key`
        matches).
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoResetRequest'
      responses:
        '201':
          $ref: '#/components/responses/DemoResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /demo/creators/{ticker}/fill-raise:
    post:
      summary: Fill the open raise (demo)
      operationId: DemoFillRaise
      tags:
        - Demo
      description: >-
        Demo only, presenter gate as `DemoReset`. Invests the remaining raise
        from the oracle wallet. The `invest` chain job (mint, approve, invest)
        runs on the worker, so the oracle key never signs from two processes.
        Closing the raise releases tranche 0 and seeds the pool.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/AdminKey'
      responses:
        '201':
          $ref: '#/components/responses/DemoResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /demo/creators/{ticker}/advance-deadline:
    post:
      summary: Move the proof deadline into the past (demo)
      operationId: DemoAdvanceDeadline
      tags:
        - Demo
      description: >-
        Demo only, presenter gate as `DemoReset`. Sets the next proof due date
        to the past so the freeze path can be shown.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - $ref: '#/components/parameters/AdminKey'
      responses:
        '201':
          $ref: '#/components/responses/DemoResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/trigger-default:
    post:
      summary: Trigger a default (demo)
      operationId: TriggerDefault
      tags:
        - Income
      description: >-
        Demo only. Fast-forwards the creator's deadline and grace period, then
        liquidates: refunds locked escrow, slashes the stake, blacklists the
        World ID. Returns `403` unless the server runs with `DEMO_MODE=1` and
        the request carries an `X-Admin-Key` header equal to the server's
        `SMX_ADMIN_KEY` (unset disables the route).
      security:
        - {}
      parameters:
        - name: X-Admin-Key
          in: header
          required: false
          description: Admin key (`SMX_ADMIN_KEY`).
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerDefaultRequest'
      responses:
        '201':
          description: The defaulted creator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dividends/{dividendId}/payment:
    post:
      summary: Pay a dividend
      operationId: PayDividend
      tags:
        - Income
      description: >-
        Marks a due dividend paid. Live chain mode (the creator has an ISA): the
        creator signs `distributeDividend` in USDC first and sends the `txHash`;
        the server verifies the receipt and holders claim from their portfolio
        (`CreateDividendClaim`). A live creator without a `txHash` gets `409`.
        Otherwise it splits the dividend pro rata across current holders and
        queues the onchain distribution. When the body carries a
        `paymentPayload` (the transaction the creator's wallet signed for the
        x402 payment request), the server settles it on Hedera first; without
        one the payment rail pays holders from the worker. Only the creator
        can pay; `409` when it is already paid.
      security:
        - BearerAuth: []
      parameters:
        - name: dividendId
          in: path
          required: true
          description: Dividend id.
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayDividendRequest'
      responses:
        '201':
          description: The paid dividend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dividend'
        '204':
          description: htmx request; the `HX-Trigger` header carries the result.
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dividends/{dividendId}/payment-request:
    post:
      summary: Create a dividend payment request
      operationId: CreateDividendPaymentRequest
      tags:
        - Income
      description: >-
        Returns the x402 payment requirements for a due dividend: what the
        creator's wallet must sign on Hedera to pay every holder. Only the
        creator can call it. Splits come from SQL (pro rata by holdings). Sign
        the transaction in the browser, then send it as `paymentPayload` to
        `POST /dividends/{dividendId}/payment`.
      security:
        - BearerAuth: []
      parameters:
        - name: dividendId
          in: path
          required: true
          description: Dividend id.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '201':
          description: x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /reclaim/sessions/{sessionId}:
    get:
      summary: Reclaim session status
      operationId: GetReclaimSessionStatus
      tags:
        - Income
      description: >-
        Polling fallback for the SSE feed: the status of a Reclaim verification
        session created by `CreateReclaimSession`. While the session is
        pending, the server also asks Reclaim for its current status. Only the
        creator can read it.
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Reclaim session id.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Session status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclaimSessionStatus'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/rp-signature:
    post:
      summary: Sign a World ID request
      operationId: CreateRpSignature
      tags:
        - Creators
      description: >-
        Signs the World ID 4.0 relying-party request on the server (the signing
        key never reaches the browser). The signal is the wallet of the SIWE
        session, never the request. Pass the result to IDKit as `rp_context`.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Signed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldIdRequest'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/world-id/check:
    post:
      summary: Check a World ID proof before launch
      operationId: CheckWorldId
      tags:
        - Creators
      description: >-
        Verifies the World ID proof (signal is the SIWE session's wallet) and
        checks that its nullifier hasn't launched an IPO and isn't blacklisted.
        Call it as soon as IDKit returns, so a Sybil or banned human is stopped
        before the form is submitted. `LaunchIpo` runs the same checks again.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckWorldIdRequest'
      responses:
        '200':
          description: The proof is valid and this human can launch an IPO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldIdCheck'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /events:
    get:
      summary: Stream oracle events
      operationId: StreamEvents
      tags:
        - Events
      description: >-
        Server-Sent Events of new oracle events, optionally for one ticker.
        Each event is sent twice: `oracle-event` carries an HTML list item (for
        htmx `sse-swap`) and `oracle-event-json` carries the JSON. `chain-job`
        events announce onchain call status changes and carry no `id`.
        Every oracle event message carries `id:` = the event's `seq`. Reconnect
        with `Last-Event-ID` (or `since`) to replay up to 50 missed oracle
        events, oldest first, before live ones.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: ticker
          in: query
          required: false
          description: Only events for this ticker.
          schema:
            $ref: '#/components/schemas/Ticker'
        - name: since
          in: query
          required: false
          description: Replay oracle events with a `seq` greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Set by `EventSource` on reconnect. Parsed leniently: a value that
            isn't a number is ignored. `since` wins when both are sent.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ProblemResponse'
  /mock-bank:
    get:
      summary: Mock bank statement
      operationId: GetMockBank
      tags:
        - Income
      description: >-
        A fake bank statement page (simulates HDFC). The deposits follow the
        scenario chosen at login ($5,000 by default). Redirects to `/mock-bank/login` without the `smx_bank_session`
        cookie. The page calls `GET /mock-bank/api/transactions`, which is what
        the Reclaim provider proves.
      security:
        - {}
      responses:
        '200':
          description: Statement page.
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
        '302':
          description: Not signed in; redirect to the login page.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ProblemResponse'
  /mock-bank/login:
    get:
      summary: Mock bank login page
      operationId: GetMockBankLogin
      tags:
        - Income
      description: >-
        Login form for the mock bank. Any non-empty values work. Renders even
        with a bank session cookie, so a signed-in browser can log in again
        with another income scenario.
      security:
        - {}
      responses:
        '200':
          description: Login page.
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlContent'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      summary: Mock bank login
      operationId: MockBankLogin
      tags:
        - Income
      description: >-
        Accepts any non-empty username and password and an optional income
        `scenario`, sets the httpOnly
        `smx_bank_session` cookie and redirects to `/mock-bank`.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 60
                password:
                  type: string
                  minLength: 1
                  maxLength: 100
                scenario:
                  $ref: '#/components/schemas/MockBankScenario'
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 60
                password:
                  type: string
                  minLength: 1
                  maxLength: 100
                scenario:
                  $ref: '#/components/schemas/MockBankScenario'
      responses:
        '303':
          description: Signed in; redirect to the statement.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ProblemResponse'
  /mock-bank/api/transactions:
    get:
      summary: Mock bank transactions
      operationId: GetMockBankTransactions
      tags:
        - Income
      description: >-
        Statement JSON for the signed-in mock bank customer. Requires the
        `smx_bank_session` cookie; `401` otherwise. This is the auth-bound
        request the Reclaim provider proves.
      security:
        - {}
      responses:
        '200':
          description: Statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockBank'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque Better Auth session token returned by `POST /auth/siwe/verify`.
        Sent as a bearer header or in the `better-auth.session_token` cookie;
        the server resolves it to a user.
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Browser session cookie set by `POST /auth/siwe/verify`.
  responses:
    HTMLResponse:
      description: HTML response
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlContent'
    DemoResult:
      description: Demo helper result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DemoResult'
    ProblemResponse:
      description: >-
        Error response. JSON callers receive an RFC 9457 problem document; HTML
        callers receive a rendered error page. Status code is set by the origin
        server and reflected in the `Problem.status` field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlContent'
  parameters:
    AdminKey:
      name: X-Admin-Key
      in: header
      required: false
      description: Admin key (`SMX_ADMIN_KEY`); an alternative to the presenter wallet.
      schema:
        type: string
        maxLength: 200
    Ticker:
      name: ticker
      in: path
      required: true
      description: Creator ticker, 3 to 6 uppercase letters.
      schema:
        $ref: '#/components/schemas/Ticker'
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque pagination cursor from a previous response's `nextPageCursor`.
        Omit for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 500
  schemas:
    HtmlContent:
      type: string
      example: <html><body><h1>Hello, World!</h1></body></html>
    Timestamp:
      type: string
      format: date-time
    Uuid:
      type: string
      format: uuid
      maxLength: 36
    X402PaymentRequired:
      type: object
      description: x402 v2 payment required document.
      required: [x402Version, resource, accepts]
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
        resource:
          type: object
          additionalProperties: true
        accepts:
          type: array
          items:
            type: object
            additionalProperties: true
    AuditReport:
      type: object
      description: Premium audit data for one creator.
      required: [ticker, latestAudit, verifiedIncome]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        latestAudit:
          type: object
          nullable: true
          additionalProperties: true
        verifiedIncome:
          type: array
          items:
            type: object
            additionalProperties: true
    Ticker:
      type: string
      pattern: ^[A-Z]{3,6}$
      minLength: 3
      maxLength: 6
      example: MUSH
    EvmAddress:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
      minLength: 42
      maxLength: 42
    TxHash:
      type: string
      pattern: ^0x[0-9a-f]{64}$
      minLength: 66
      maxLength: 66
    Money:
      type: string
      description: USDC amount as a decimal string, at most 6 decimals.
      pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
      minLength: 1
      maxLength: 20
      example: '5000.00'
    TokenAmount:
      type: string
      description: Token amount as a decimal string, at most 18 decimals.
      pattern: ^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$
      minLength: 1
      maxLength: 40
      example: '12.5'
    DecimalString:
      type: string
      description: Exact decimal number (money, price or token amount) as text.
      pattern: ^[0-9]+(\.[0-9]+)?$
      maxLength: 80
    CreatorStatus:
      type: string
      enum: [DRAFT, LIVE, GRACE, DEFAULTED, COMPLETED]
    PricePoint:
      type: object
      required: [at, price]
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/DecimalString'
    Tranche:
      type: object
      required: [idx, amount, status]
      properties:
        idx:
          type: integer
          minimum: 0
          maximum: 11
        amount:
          $ref: '#/components/schemas/DecimalString'
        status:
          type: string
          enum: [LOCKED, RELEASED, REFUNDED]
        releasedAt:
          $ref: '#/components/schemas/Timestamp'
        txHash:
          $ref: '#/components/schemas/TxHash'
    CreatorSummary:
      type: object
      description: >-
        A creator in a list: price, 24h change and a sparkline built from
        price ticks.
      required:
        - id
        - ticker
        - displayName
        - headline
        - status
        - price
        - change24h
        - volume24h
        - raised
        - targetRaise
        - shareBps
        - sparkline
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        headline:
          type: string
          maxLength: 280
        status:
          $ref: '#/components/schemas/CreatorStatus'
        price:
          $ref: '#/components/schemas/DecimalString'
        change24h:
          type: number
          description: Percent change in price over 24 hours.
        volume24h:
          $ref: '#/components/schemas/DecimalString'
        raised:
          $ref: '#/components/schemas/DecimalString'
        targetRaise:
          $ref: '#/components/schemas/DecimalString'
        shareBps:
          type: integer
          minimum: 1
          maximum: 5000
        sparkline:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PricePoint'
    Creator:
      description: A creator's full L-ISA document.
      allOf:
        - $ref: '#/components/schemas/CreatorSummary'
        - type: object
          required:
            - ownerWallet
            - termMonths
            - stakeAmount
            - minIncome
            - createdAt
            - tranches
            - escrow
            - chain
            - proofCadence
            - socialLinks
          properties:
            proofCadence:
              $ref: '#/components/schemas/ProofCadence'
            socialLinks:
              $ref: '#/components/schemas/SocialLinks'
            ownerWallet:
              $ref: '#/components/schemas/EvmAddress'
            termMonths:
              type: integer
              minimum: 1
              maximum: 120
            stakeAmount:
              $ref: '#/components/schemas/DecimalString'
            minIncome:
              $ref: '#/components/schemas/DecimalString'
            termsRef:
              type: string
              maxLength: 200
              description: >-
                0G Storage root hash of the L-ISA legal terms, or
                `local:<sha256>` until the background upload finishes.
            termsStorage:
              $ref: '#/components/schemas/StorageStatus'
            termsHash:
              type: string
              maxLength: 200
            contractAddress:
              $ref: '#/components/schemas/EvmAddress'
            tokenAddress:
              $ref: '#/components/schemas/EvmAddress'
            atsTokenAddress:
              $ref: '#/components/schemas/EvmAddress'
            poolAddress:
              $ref: '#/components/schemas/EvmAddress'
            worldIdNullifier:
              type: string
              description: World ID nullifier that verified the creator as a unique human.
              maxLength: 80
            chainId:
              type: integer
              minimum: 1
            nextProofDueAt:
              $ref: '#/components/schemas/Timestamp'
            graceUntil:
              $ref: '#/components/schemas/Timestamp'
            ipoAt:
              $ref: '#/components/schemas/Timestamp'
            createdAt:
              $ref: '#/components/schemas/Timestamp'
            tranches:
              type: array
              maxItems: 12
              items:
                $ref: '#/components/schemas/Tranche'
            escrow:
              type: object
              required: [locked, released, refunded]
              properties:
                locked:
                  $ref: '#/components/schemas/DecimalString'
                released:
                  $ref: '#/components/schemas/DecimalString'
                refunded:
                  $ref: '#/components/schemas/DecimalString'
            chain:
              type: object
              description: Onchain status. `pendingJobs` > 0 means "pending" in the UI.
              required: [pendingJobs]
              properties:
                pendingJobs:
                  type: integer
                  minimum: 0
                lastTxHash:
                  $ref: '#/components/schemas/TxHash'
    Holding:
      type: object
      required: [creatorId, ticker, wallet, balance, value]
      properties:
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        wallet:
          $ref: '#/components/schemas/EvmAddress'
        userId:
          $ref: '#/components/schemas/Uuid'
          description: Account that owns the wallet. Absent for wallets that never signed in.
        balance:
          $ref: '#/components/schemas/DecimalString'
        sharePct:
          type: number
          description: Share of the circulating supply, in percent.
        value:
          $ref: '#/components/schemas/DecimalString'
    Trade:
      type: object
      required:
        - id
        - creatorId
        - ticker
        - wallet
        - side
        - usdcAmount
        - tokenAmount
        - price
        - fee
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        wallet:
          $ref: '#/components/schemas/EvmAddress'
        side:
          type: string
          enum: [BUY, SELL]
        usdcAmount:
          $ref: '#/components/schemas/DecimalString'
        tokenAmount:
          $ref: '#/components/schemas/DecimalString'
        price:
          $ref: '#/components/schemas/DecimalString'
        fee:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Investment:
      type: object
      required:
        - id
        - creatorId
        - ticker
        - wallet
        - usdcAmount
        - tokenAmount
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        wallet:
          $ref: '#/components/schemas/EvmAddress'
        usdcAmount:
          $ref: '#/components/schemas/DecimalString'
        tokenAmount:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        holding:
          $ref: '#/components/schemas/Holding'
    IncomeProof:
      type: object
      required:
        - id
        - creatorId
        - ticker
        - period
        - provider
        - reclaimProofId
        - verifiedAmount
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        period:
          type: integer
          minimum: 0
        provider:
          type: string
          maxLength: 200
        reclaimProofId:
          type: string
          maxLength: 500
        verifiedAmount:
          $ref: '#/components/schemas/DecimalString'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reasoning:
          type: string
          maxLength: 1000
        rejectReason:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 200
        auditLogRef:
          type: string
          maxLength: 500
        auditLogStorage:
          $ref: '#/components/schemas/StorageStatus'
        auditStatus:
          type: string
          description: >-
            `AUDIT_UNAVAILABLE` while a `PENDING` proof waits for a retry
            because 0G could not audit it.
          enum: [AUDIT_UNAVAILABLE]
        auditMessage:
          type: string
          maxLength: 500
        engine:
          type: string
          description: >-
            Who audited: `0g-router` (0G Private Computer), `0g-compute`, or
            `rules` (offline dev fallback, never silent in the UI).
          enum: [0g-router, 0g-compute, rules]
        requestId:
          type: string
          description: 0G Router request id (`x_0g_trace.request_id`).
          maxLength: 200
        providerAddress:
          type: string
          description: On-chain address of the TEE provider that served the audit.
          maxLength: 100
        teeVerified:
          type: boolean
          description: Present only when the Router verified the TEE signature.
        trustMode:
          type: string
          description: Trust tier the request was restricted to.
          maxLength: 20
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ZeroGBalance:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        address:
          type: string
          maxLength: 100
        creditUsd:
          type: string
          description: Remaining credit in USD, six decimals.
          maxLength: 40
        creditMicroUsd:
          type: string
          maxLength: 40
    StorageStatus:
      type: string
      description: >-
        State of the 0G Storage upload behind a ref. `PENDING` keeps a
        `local:<sha256>` ref until `STORAGE_CONFIRMED` swaps in the root hash;
        `SKIPPED` (no key or low balance) and `FAILED` keep the local ref.
      enum: [PENDING, UPLOADED, SKIPPED, FAILED]
    Dividend:
      type: object
      required: [id, creatorId, ticker, proofId, amountDue, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        proofId:
          $ref: '#/components/schemas/Uuid'
        period:
          type: integer
          minimum: 0
        amountDue:
          $ref: '#/components/schemas/DecimalString'
        status:
          type: string
          enum: [DUE, PAID]
        paidTxHash:
          $ref: '#/components/schemas/TxHash'
        paidAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    OracleEvent:
      type: object
      required: [id, seq, creatorId, ticker, kind, payload, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic cursor; the SSE `id:` of this event.
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        kind:
          type: string
          enum:
            - IPO
            - INVESTED
            - PROOF_VERIFIED
            - PROOF_REJECTED
            - TRANCHE_RELEASED
            - STAKE_RETURNED
            - DIVIDEND_PAID
            - GRACE_STARTED
            - DEFAULTED
            - TRADE
            - ESCROW_FROZEN
            - ESCROW_UNFROZEN
            - STORAGE_CONFIRMED
            - CREATOR_UPDATE
        payload:
          type: object
          description: Kind-specific details; always includes `ticker`.
          additionalProperties: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ChainJob:
      type: object
      required: [id, creatorId, fn, status, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        fn:
          type: string
          enum:
            - createISA
            - initializeIPO
            - invest
            - unlockNextTranche
            - distributeDividend
            - executeLiquidation
            - closeRaise
            - reclaimStake
        status:
          type: string
          enum: [QUEUED, SENT, CONFIRMED, FAILED, SIMULATED]
        txHash:
          $ref: '#/components/schemas/TxHash'
        error:
          type: string
          maxLength: 2000
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Exchange:
      type: object
      required: [totals, trending, events]
      properties:
        hasMoreTrending:
          type: boolean
          description: True when `GET /creators` lists more than `trending`.
        hasMoreEvents:
          type: boolean
          description: True when `GET /activity` lists more than `events`.
        totals:
          type: object
          description: Exchange-wide figures across all creators.
          required: [totalRaised, activeCreators, dividendsPaid, holders]
          properties:
            totalRaised:
              $ref: '#/components/schemas/Money'
            activeCreators:
              type: integer
              minimum: 0
              description: Creators that are live or in the grace period.
            dividendsPaid:
              $ref: '#/components/schemas/Money'
            holders:
              type: integer
              minimum: 0
              description: Distinct wallets holding any creator token.
        trending:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreatorSummary'
        events:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OracleEvent'
    CreatorPage:
      type: object
      required: [creator, chart, holders, trades, events, proofs, dividends, viewer, market]
      properties:
        creator:
          $ref: '#/components/schemas/Creator'
        chart:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PricePoint'
        holders:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Holding'
        trades:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Trade'
        events:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OracleEvent'
        proofs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/IncomeProof'
        dividends:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Dividend'
        updates:
          type: array
          maxItems: 5
          description: The latest creator updates, newest first.
          items:
            $ref: '#/components/schemas/CreatorUpdate'
        more:
          type: object
          description: >-
            Per list, true when its full page holds more rows than shown here.
          properties:
            updates:
              type: boolean
            holders:
              type: boolean
            trades:
              type: boolean
            events:
              type: boolean
            proofs:
              type: boolean
            dividends:
              type: boolean
        viewer:
          type: object
          properties:
            wallet:
              $ref: '#/components/schemas/EvmAddress'
            holding:
              $ref: '#/components/schemas/Holding'
        market:
          $ref: '#/components/schemas/Market'
    SignedDecimalString:
      type: string
      description: Exact decimal number that may be negative, as text.
      pattern: ^-?[0-9]+(\.[0-9]+)?$
      maxLength: 80
    DepthLevel:
      type: object
      description: One rung of the pool-curve depth ladder.
      required: [sizeUsdc, tokens, avgPrice, impactPct]
      properties:
        sizeUsdc:
          $ref: '#/components/schemas/DecimalString'
        tokens:
          $ref: '#/components/schemas/DecimalString'
          description: Tokens received (asks) or sold (bids).
        avgPrice:
          $ref: '#/components/schemas/DecimalString'
        impactPct:
          $ref: '#/components/schemas/SignedDecimalString'
          description: >-
            Average price vs the spot price in percent: positive for asks,
            negative for bids.
    PriceRange:
      type: object
      required: [low, high]
      properties:
        low:
          $ref: '#/components/schemas/DecimalString'
        high:
          $ref: '#/components/schemas/DecimalString'
    Market:
      type: object
      description: >-
        Instrument-view data for one creator token: quote, day statistics, pool
        depth, status, fundamentals, the viewer's position and corporate
        actions.
      required:
        - quote
        - ohlc24h
        - dayRange
        - sinceIpoRange
        - volume24h
        - vwap24h
        - trades24h
        - pool
        - depth
        - status
        - fundamentals
        - position
        - corporateActions
      properties:
        quote:
          type: object
          required: [price, change24h, changePct24h]
          properties:
            price:
              $ref: '#/components/schemas/DecimalString'
            change24h:
              $ref: '#/components/schemas/SignedDecimalString'
            changePct24h:
              $ref: '#/components/schemas/SignedDecimalString'
        ohlc24h:
          type: object
          required: [open, high, low, close]
          properties:
            open:
              $ref: '#/components/schemas/DecimalString'
            high:
              $ref: '#/components/schemas/DecimalString'
            low:
              $ref: '#/components/schemas/DecimalString'
            close:
              $ref: '#/components/schemas/DecimalString'
        dayRange:
          $ref: '#/components/schemas/PriceRange'
        sinceIpoRange:
          $ref: '#/components/schemas/PriceRange'
        volume24h:
          $ref: '#/components/schemas/DecimalString'
        vwap24h:
          description: Volume-weighted average price over 24 hours; null with no trades.
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        trades24h:
          type: integer
          minimum: 0
        pool:
          type: object
          required: [usdcReserve, tokenReserve, feeBps]
          properties:
            usdcReserve:
              $ref: '#/components/schemas/DecimalString'
            tokenReserve:
              $ref: '#/components/schemas/DecimalString'
            feeBps:
              type: integer
              minimum: 0
        depth:
          type: object
          required: [bids, asks]
          properties:
            bids:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/DepthLevel'
            asks:
              type: array
              maxItems: 4
              items:
                $ref: '#/components/schemas/DepthLevel'
        status:
          type: object
          required: [kind, label, tradingHalted]
          properties:
            kind:
              type: string
              enum: [LIVE, GRACE, FROZEN, DEFAULTED, COMPLETED]
            label:
              type: string
              maxLength: 200
            tradingHalted:
              type: boolean
        fundamentals:
          type: object
          required:
            - marketCap
            - supply
            - shareBps
            - termMonths
            - termLeftMonths
            - verifiedIncomeTotal
            - dividendsPaidTotal
            - nextProofDueAt
            - holders
          properties:
            marketCap:
              $ref: '#/components/schemas/DecimalString'
            supply:
              $ref: '#/components/schemas/DecimalString'
            shareBps:
              type: integer
            termMonths:
              type: integer
            termLeftMonths:
              type: integer
              minimum: 0
            verifiedIncomeTotal:
              $ref: '#/components/schemas/DecimalString'
            dividendsPaidTotal:
              $ref: '#/components/schemas/DecimalString'
            nextProofDueAt:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            holders:
              type: integer
              minimum: 0
        position:
          description: The signed-in viewer's holding; null when signed out or flat.
          oneOf:
            - type: object
              required: [tokens, avgCost, value, pnl, pnlPct]
              properties:
                tokens:
                  $ref: '#/components/schemas/DecimalString'
                avgCost:
                  $ref: '#/components/schemas/DecimalString'
                value:
                  $ref: '#/components/schemas/DecimalString'
                pnl:
                  $ref: '#/components/schemas/SignedDecimalString'
                pnlPct:
                  $ref: '#/components/schemas/SignedDecimalString'
            - type: 'null'
        corporateActions:
          type: array
          maxItems: 50
          description: Newest first.
          items:
            type: object
            required: [at, kind, label, amount]
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              kind:
                type: string
                enum:
                  - IPO
                  - PROOF_VERIFIED
                  - PROOF_REJECTED
                  - TRANCHE_RELEASED
                  - STAKE_RETURNED
                  - DIVIDEND_PAID
                  - ESCROW_FROZEN
                  - ESCROW_UNFROZEN
                  - DEFAULTED
              label:
                type: string
                maxLength: 300
              amount:
                oneOf:
                  - $ref: '#/components/schemas/DecimalString'
                  - type: 'null'
    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t:
          $ref: '#/components/schemas/Timestamp'
          description: Bucket start.
        o:
          $ref: '#/components/schemas/DecimalString'
        h:
          $ref: '#/components/schemas/DecimalString'
        l:
          $ref: '#/components/schemas/DecimalString'
        c:
          $ref: '#/components/schemas/DecimalString'
        v:
          $ref: '#/components/schemas/DecimalString'
          description: USDC traded in the bucket.
    Candles:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Candle'
    WatchlistItem:
      description: A creator summary plus when the viewer added it.
      allOf:
        - $ref: '#/components/schemas/CreatorSummary'
        - type: object
          required: [addedAt]
          properties:
            addedAt:
              $ref: '#/components/schemas/Timestamp'
    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/WatchlistItem'
    Funds:
      type: object
      required: [status, canRequestUsdc]
      properties:
        status:
          type: string
          enum: [OK, UNAVAILABLE]
          description: '`UNAVAILABLE` in simulated chain mode or when the read fails.'
        usdc:
          $ref: '#/components/schemas/DecimalString'
        hbar:
          $ref: '#/components/schemas/DecimalString'
        canRequestUsdc:
          type: boolean
          description: True when MockUSDC has a public faucet on the live chain.
    PortfolioHolding:
      type: object
      required: [creatorId, ticker, displayName, tokens, avgCost, price, value, pnl, pnlPct, status]
      properties:
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        tokens:
          $ref: '#/components/schemas/DecimalString'
        avgCost:
          $ref: '#/components/schemas/DecimalString'
        price:
          $ref: '#/components/schemas/DecimalString'
        value:
          $ref: '#/components/schemas/DecimalString'
        pnl:
          type: string
          maxLength: 64
          description: Signed decimal, USDC.
        pnlPct:
          type: string
          maxLength: 32
          description: Signed decimal percent.
        status:
          type: string
          enum: [LIVE, GRACE, FROZEN, DEFAULTED, COMPLETED]
        statusLabel:
          type: string
          maxLength: 120
    PortfolioTotals:
      type: object
      required: [invested, value, pnl, pnlPct]
      properties:
        invested:
          $ref: '#/components/schemas/DecimalString'
        value:
          $ref: '#/components/schemas/DecimalString'
        pnl:
          type: string
          maxLength: 64
        pnlPct:
          type: string
          maxLength: 32
    DividendReceived:
      type: object
      required: [id, creatorId, ticker, displayName, amount, createdAt]
      description: >-
        A dividend payout, or a USDC claim (no `dividendId`).
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        dividendId:
          $ref: '#/components/schemas/Uuid'
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        amount:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    WalletTransaction:
      type: object
      required: [id, type, creatorId, ticker, displayName, tokenAmount, usdcAmount, price, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [INVESTMENT, BUY, SELL]
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        tokenAmount:
          $ref: '#/components/schemas/DecimalString'
        usdcAmount:
          $ref: '#/components/schemas/DecimalString'
        price:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Portfolio:
      type: object
      required: [totals, holdings, transactions, dividends, funds]
      properties:
        wallet:
          $ref: '#/components/schemas/EvmAddress'
        funds:
          $ref: '#/components/schemas/Funds'
        totals:
          $ref: '#/components/schemas/PortfolioTotals'
        holdings:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PortfolioHolding'
        transactions:
          type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/WalletTransaction'
            nextPageCursor:
              type: string
              maxLength: 500
              description: Pass as `cursor` for the next page. Absent on the last page.
        dividends:
          type: object
          required: [total, count, items]
          properties:
            total:
              $ref: '#/components/schemas/DecimalString'
            count:
              type: integer
              minimum: 0
            items:
              type: array
              maxItems: 25
              description: The latest 25 payouts, newest first.
              items:
                $ref: '#/components/schemas/DividendReceived'
        claimable:
          type: array
          maxItems: 50
          description: >-
            Onchain creators whose USDC dividends the wallet can claim. Empty
            when the chain is simulated or a read fails.
          items:
            $ref: '#/components/schemas/ClaimableDividend'
        creator:
          $ref: '#/components/schemas/CreatorRef'
    ClaimableDividend:
      type: object
      required: [creatorId, ticker, displayName, amount]
      properties:
        creatorId:
          $ref: '#/components/schemas/Uuid'
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        amount:
          $ref: '#/components/schemas/DecimalString'
    DividendClaimRequest:
      type: object
      required: [ticker, txHash]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        txHash:
          $ref: '#/components/schemas/TxHash'
    DividendClaim:
      type: object
      required: [id, amount, txHash]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
    FaucetResult:
      type: object
      required: [amount, txHash]
      properties:
        amount:
          $ref: '#/components/schemas/DecimalString'
        txHash:
          $ref: '#/components/schemas/TxHash'
    CreatorRef:
      type: object
      required: [ticker, displayName, status]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/CreatorStatus'
    CreatorsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatorSummary'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OracleEvent'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    HoldersPage:
      type: object
      required: [creator, items]
      properties:
        creator:
          $ref: '#/components/schemas/CreatorRef'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Holding'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    TradesPage:
      type: object
      required: [creator, items]
      properties:
        creator:
          $ref: '#/components/schemas/CreatorRef'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Trade'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    ProofsPage:
      type: object
      required: [creator, items]
      properties:
        creator:
          $ref: '#/components/schemas/CreatorRef'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/IncomeProof'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    DividendsPage:
      type: object
      required: [creator, items]
      properties:
        creator:
          $ref: '#/components/schemas/CreatorRef'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Dividend'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    CreatorHub:
      type: object
      description: >-
        The viewer's creator dashboard. Every field is absent until the viewer
        launches an IPO.
      properties:
        creator:
          $ref: '#/components/schemas/Creator'
        pendingDividend:
          $ref: '#/components/schemas/Dividend'
        dividends:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Dividend'
        proofs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/IncomeProof'
        chainJobs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ChainJob'
        more:
          type: object
          description: >-
            Per list, true when its full page holds more rows than shown here
            (`events`: true when the creator has any).
          properties:
            proofs:
              type: boolean
            dividends:
              type: boolean
            events:
              type: boolean
        updatesLeft:
          type: integer
          minimum: 0
          maximum: 5
          description: Updates the creator can still post in the next 24 hours.
        collateral:
          type: object
          required: [stakeAmount, atRisk]
          properties:
            stakeAmount:
              $ref: '#/components/schemas/DecimalString'
            atRisk:
              type: boolean
    LaunchState:
      type: object
      required: [wallet, hasCreator, defaults, worldId]
      properties:
        wallet:
          $ref: '#/components/schemas/EvmAddress'
        hasCreator:
          type: boolean
        ticker:
          $ref: '#/components/schemas/Ticker'
        defaults:
          type: object
          required: [shareBps, termMonths, trancheBps, minIncome]
          properties:
            shareBps:
              type: integer
            termMonths:
              type: integer
            trancheBps:
              type: array
              maxItems: 5
              items:
                type: integer
            minIncome:
              $ref: '#/components/schemas/Money'
        worldId:
          type: object
          required: [simulated]
          properties:
            appId:
              type: string
              maxLength: 200
            rpId:
              type: string
              maxLength: 200
            action:
              type: string
              maxLength: 200
            simulated:
              type: boolean
              description: True when no World ID app is configured (demo fallback).
    ReclaimSession:
      type: object
      required: [sessionId, requestUrl, statusUrl]
      properties:
        sessionId:
          type: string
          maxLength: 500
        requestUrl:
          type: string
          maxLength: 4000
        statusUrl:
          type: string
          maxLength: 2000
    AuditResult:
      type: object
      required: [approved, proof]
      properties:
        approved:
          type: boolean
        proof:
          $ref: '#/components/schemas/IncomeProof'
        dividend:
          $ref: '#/components/schemas/Dividend'
    MockBankScenario:
      type: string
      description: >-
        Income scenario stored in the bank session. Unknown or missing values
        mean `salary`.
      enum: [salary, low, big, several, none, late]
    MockBank:
      type: object
      required: [account, balance, transactions]
      properties:
        account:
          type: string
          maxLength: 100
        holderName:
          type: string
          maxLength: 100
        balance:
          $ref: '#/components/schemas/Money'
        transactions:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, date, description, amount, type]
            properties:
              id:
                type: string
                maxLength: 50
              date:
                type: string
                format: date
              description:
                type: string
                maxLength: 200
              amount:
                $ref: '#/components/schemas/Money'
              type:
                type: string
                enum: [DEPOSIT, WITHDRAWAL]
    LaunchIpoRequest:
      type: object
      required: [ticker, displayName, targetRaise, stakeAmount, worldIdProof]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        headline:
          type: string
          maxLength: 280
          default: ''
        shareBps:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
          default: 60
        targetRaise:
          $ref: '#/components/schemas/Money'
        stakeAmount:
          $ref: '#/components/schemas/Money'
        trancheSchedule:
          $ref: '#/components/schemas/TrancheSchedule'
        proofCadence:
          $ref: '#/components/schemas/ProofCadence'
        socialLinks:
          $ref: '#/components/schemas/SocialLinks'
        worldIdProof:
          type: object
          description: Raw IDKit result from the browser; verified server-side.
          maxProperties: 50
          additionalProperties: true
    TrancheSchedule:
      type: string
      description: >-
        How escrow releases, as the percent of the raise per tranche. The first
        tranche releases at launch; each approved income proof releases the
        next. `single` is one tranche: everything releases when the raise
        closes, with no escrow milestones.
      enum: ['20-40-40', 'single', '50-50', '25-25-25-25', '20-20-20-20-20']
      default: '20-40-40'
    ProofCadence:
      type: string
      description: >-
        How often income proofs are due: every 30 days (`MONTHLY`) or every 90
        days (`QUARTERLY`). A 14-day grace period follows a missed deadline.
      enum: [MONTHLY, QUARTERLY]
      default: MONTHLY
    SocialLinks:
      type: object
      description: >-
        Optional profile links, at most one per network. Every link is https
        and on the network's own host; `website` can be any https address.
      additionalProperties: false
      maxProperties: 4
      properties:
        x:
          type: string
          maxLength: 200
          pattern: ^https://(www\.)?(x|twitter)\.com/[A-Za-z0-9_]{1,15}/?$
          example: https://x.com/mushaheed
        github:
          type: string
          maxLength: 200
          pattern: ^https://(www\.)?github\.com/[A-Za-z0-9][A-Za-z0-9-]{0,38}(/[A-Za-z0-9._-]{1,100})?/?$
          example: https://github.com/mushaheed
        linkedin:
          type: string
          maxLength: 200
          pattern: ^https://([a-z]{2,3}\.)?linkedin\.com/(in|company)/[A-Za-z0-9_%-]{3,100}/?$
          example: https://www.linkedin.com/in/mushaheed
        website:
          type: string
          maxLength: 300
          pattern: ^https://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+(:[0-9]{1,5})?(/[^\s<>"'`\\]*)?$
          example: https://mushaheed.dev
    CreatorUpdate:
      type: object
      required: [id, body, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: Plain text. Render it escaped.
        link:
          type: string
          maxLength: 300
          description: Optional https link.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreateCreatorUpdateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
          description: Plain text, 1 to 1,000 characters.
        link:
          type: string
          maxLength: 300
          pattern: ^(https://\S+)?$
          description: Optional https link. Blank means no link.
    CreatorUpdatesPage:
      type: object
      required: [creator, items]
      properties:
        creator:
          $ref: '#/components/schemas/CreatorRef'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatorUpdate'
        nextPageCursor:
          type: string
          maxLength: 500
          description: Pass as `cursor` for the next page. Absent on the last page.
    CheckWorldIdRequest:
      type: object
      required: [worldIdProof]
      properties:
        worldIdProof:
          type: object
          description: Raw IDKit result from the browser; verified server-side.
          maxProperties: 50
          additionalProperties: true
    WorldIdCheck:
      type: object
      required: [launchable, simulated]
      properties:
        launchable:
          type: boolean
          description: Always true; a used or banned nullifier returns 409 or 403.
        simulated:
          type: boolean
          description: True when the proof came from the demo simulator.
    InvestRequest:
      type: object
      description: >-
        Either `usdcAmount` (simulated chain mode) or the `txHash` of the
        user's signed `invest` transaction (live mode). The server rejects a body
        with neither.
      properties:
        usdcAmount:
          $ref: '#/components/schemas/Money'
        txHash:
          $ref: '#/components/schemas/TxHash'
    CloseRaiseRequest:
      type: object
      description: >-
        Live chain mode only: the `txHash` of the creator's signed `closeRaise`
        transaction.
      properties:
        txHash:
          $ref: '#/components/schemas/TxHash'
    CreatorChain:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [live, simulated]
        chainId:
          type: integer
        rpcUrl:
          type: string
          maxLength: 300
          description: Public RPC URL for browser reads.
        isa:
          $ref: '#/components/schemas/EvmAddress'
        token:
          $ref: '#/components/schemas/EvmAddress'
        pool:
          $ref: '#/components/schemas/EvmAddress'
        usdc:
          $ref: '#/components/schemas/EvmAddress'
    TradeRequest:
      type: object
      description: >-
        Either `side` and `amountIn` (simulated chain mode) or the `txHash` of
        the user's signed swap transaction (live mode). The server rejects a body
        with neither.
      properties:
        txHash:
          $ref: '#/components/schemas/TxHash'
        side:
          type: string
          enum: [BUY, SELL]
        amountIn:
          $ref: '#/components/schemas/TokenAmount'
        minOut:
          allOf:
            - $ref: '#/components/schemas/TokenAmount'
          default: '0'
    DemoResetRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
          enum: [MUSH]
    DemoResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
          maxLength: 500
        next:
          type: string
          maxLength: 500
        links:
          type: array
          maxItems: 10
          items:
            type: object
            required: [label, url]
            properties:
              label:
                type: string
                maxLength: 100
              url:
                type: string
                maxLength: 500
    TriggerDefaultRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
    PayDividendRequest:
      type: object
      properties:
        txHash:
          $ref: '#/components/schemas/TxHash'
        paymentPayload:
          type: object
          description: >-
            The signed Hedera payment from the x402 loop (opaque; the payment
            rail settles it).
          maxProperties: 50
          additionalProperties: true
    PaymentRequest:
      type: object
      description: x402 payment requirements for a dividend (opaque to the app).
      maxProperties: 50
      additionalProperties: true
    ReclaimSessionStatus:
      type: object
      required: [sessionId, status]
      properties:
        sessionId:
          type: string
          maxLength: 200
        creatorId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [PENDING, SUCCESS, REJECTED, ERROR, CANCELLED, EXPIRED]
        failureReason:
          type: string
          maxLength: 500
        proofId:
          $ref: '#/components/schemas/Uuid'
        proofStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    WorldIdRequest:
      type: object
      required: [rpContext, appId, action, environment, signal, demo]
      properties:
        rpContext:
          type: object
          required: [rp_id, nonce, created_at, expires_at, signature]
          properties:
            rp_id:
              type: string
              maxLength: 200
            nonce:
              type: string
              maxLength: 200
            created_at:
              type: integer
            expires_at:
              type: integer
            signature:
              type: string
              maxLength: 500
        appId:
          type: string
          maxLength: 200
        action:
          type: string
          maxLength: 200
        environment:
          type: string
          enum: [staging, production]
        signal:
          type: string
          maxLength: 100
        demo:
          type: boolean
    ProofBody:
      type: object
      description: >-
        A Reclaim callback delivery (or a demo proof when `DEMO_MODE=1`). The
        shape belongs to Reclaim; the server verifies it.
      maxProperties: 100
      additionalProperties: true
    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details for HTTP APIs. Returned to JSON callers with
        `Content-Type: application/problem+json`. HTML callers receive an error
        page with the same HTTP status instead of this body.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: >-
            URI reference identifying the problem type. Defaults to
            `about:blank`, in which case `title` is the standard HTTP reason
            phrase.
          maxLength: 2000
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          maxLength: 200
        status:
          type: integer
          description: HTTP status code generated by the origin server.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: >-
            Human-readable explanation specific to this occurrence. Clients
            machine-read `type`; humans read `detail`.
          maxLength: 5000
        instance:
          type: string
          format: uri-reference
          description: >-
            URI reference identifying this occurrence. SMX sets it to the
            request id, for cross-referencing with server logs.
          maxLength: 2000
